services:
  redis:
    image: redis:7-alpine
    container_name: restropro_redis
    restart: always
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - restropro_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: restropro_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-restropro_saas}
      MYSQL_USER: ${DB_USER:-restro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-restropass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - restropro_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./restropro-saas-backend-main
      dockerfile: Dockerfile
    container_name: restropro_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${DB_USER:-restro}:${DB_PASSWORD:-restropass}@db:3306/${DB_NAME:-restropro_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-restro_jwt_secret_prod_change_me}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_EXPIRY_REFRESH: ${JWT_EXPIRY_REFRESH:-30d}
      COOKIE_EXPIRY: ${COOKIE_EXPIRY:-900000}
      COOKIE_EXPIRY_REFRESH: ${COOKIE_EXPIRY_REFRESH:-2592000000}
      # HTTP deployment requires secure=false so browsers don't drop cookies
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PASSWORD_SALT: ${PASSWORD_SALT:-10}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-https://pos.allkh.app,http://pos.allkh.app,https://pos.allkh.app:4001,http://pos.allkh.app:4001,http://10.36.200.125:4001,http://10.36.200.125}
      FRONTEND_DOMAIN_COOKIE: ${FRONTEND_DOMAIN_COOKIE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-uiflow}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-cb78b647f4d0c4ff64163317440ff83bc14edd17bd92e100aff4a492f1911c0c}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_CONFIG_ID: ${STRIPE_PORTAL_CONFIG_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_IOS_BUNDLE_ID: ${FIREBASE_IOS_BUNDLE_ID:-com.uiflow.waiterapp}
      FIREBASE_APNS_SANDBOX: ${FIREBASE_APNS_SANDBOX:-false}
      DAY_END_RECONCILIATION_ENABLED: ${DAY_END_RECONCILIATION_ENABLED:-true}
      DAY_END_RECONCILIATION_TIME: ${DAY_END_RECONCILIATION_TIME:-23:59}
      DAY_END_RECONCILIATION_REPORT_ID: ${DAY_END_RECONCILIATION_REPORT_ID:-payment-summary}
    volumes:
      - backend_uploads:/usr/src/app/public
    networks:
      - restropro_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./restropro-saas-frontend-main
      dockerfile: Dockerfile
      args:
        VITE_BACKEND: /api/v1
        VITE_BACKEND_SOCKET_IO: ""
        VITE_BACKEND_IMAGES_BASE_URL: ""
        VITE_FRONTEND_DOMAIN: ${PRIMARY_FRONTEND_DOMAIN:-https://pos.allkh.app}
        VITE_STRIPE_PRODUCT_SUBSCRIPTION_KEY: ${STRIPE_PRODUCT_SUBSCRIPTION_KEY:-price_1POsjYSCWiCS3BoQN2lnBMTz}
    container_name: restropro_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Main production ingress on port 4001
      - "${PORT:-4001}:80"
    networks:
      - restropro_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  restropro_network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
  redis_data:
